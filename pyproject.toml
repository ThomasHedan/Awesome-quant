[project]
name = "quant-dashboard"
version = "0.1.0"
description = "Local-first quantitative backtesting dashboard built on vectorbt + QuantStats."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "quant-dashboard" }]

dependencies = [
    # Core engine + analytics
    "vectorbt==0.26.2",
    "quantstats==0.0.62",
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<2.3",
    "scipy>=1.11",
    "numba>=0.59",

    # Plotting (vectorbt uses plotly; streamlit + matplotlib for tearsheets).
    # vectorbt 0.26 still references heatmapgl, which plotly>=5.22 removed.
    "plotly>=5.18,<5.22",
    "matplotlib>=3.8",

    # Dashboard
    "streamlit>=1.36",

    # Data sources
    "ccxt>=4.3",
    "yfinance>=0.2.40",
    "alpaca-py>=0.20",
    "databento>=0.40",
    "ib-insync>=0.9.86",

    # Storage / utilities
    "pyarrow>=15.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
