[project]
name = "fxgen"
version = "0.1.0"
description = "Genetic decision-tree strategy generator for FX swing trading, with strict robustness validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "joblib>=1.3",
    "numba>=0.59",
    "jinja2>=3.1",
    "plotly>=5.18",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fxgen = "fxgen.cli:main"
fxgen-mcp = "fxgen.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
