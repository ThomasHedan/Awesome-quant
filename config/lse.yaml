# Real data downloaded from London Strategic Edge with:
#   export LSE_API_KEY=...            (free key: londonstrategicedge.com/data)
#   uv run fxgen lse-download          (resumable; the free plan reads ~3 pairs x 10 years a day)
# Then: uv run fxgen --config config/lse.yaml datasets / evolve / holdout
# The free plan covers the last 10 years; the first year is kept as indicator warmup.
seed: 42

data:
  directory: data/lse
  pairs: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, NZDUSD, USDCAD, EURGBP, EURJPY, GBPJPY, AUDJPY, EURCHF]
  execution_timeframe: H1
  context_timeframes: [H4, D1]

splits:
  train_start: "2018-01-01"
  validation_start: "2023-01-01"
  holdout_start: "2025-01-01"
  end: "2026-10-31"

# Placeholder raw-spread prop-firm costs: replace with your broker's figures.
costs:
  commission_pips_round_turn: 0.7
  default_spread_pips: 1.5
  spread_pips: {EURUSD: 0.3, GBPUSD: 0.6, USDJPY: 0.4, USDCHF: 0.8, AUDUSD: 0.5, NZDUSD: 0.9,
                USDCAD: 0.8, EURGBP: 0.8, EURJPY: 0.9, GBPJPY: 1.8, AUDJPY: 1.0, EURCHF: 1.2}
  swap_pips_long: -0.5
  swap_pips_short: -0.5

storage:
  database: output/lse.db
  output_dir: output/lse
